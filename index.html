<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#FBF8F3" />
<title>민준 ♥ 서연 결혼합니다</title>

<!-- ─────────────────────────────────────────────────────────────
     카카오톡·문자로 링크를 보낼 때 보이는 정보입니다.
     크롤러는 자바스크립트를 실행하지 않으므로 반드시 아래 값을
     직접 수정해 주세요. (og:image 는 https:// 로 시작하는 전체 주소 권장)
     ───────────────────────────────────────────────────────────── -->
<meta name="description" content="2026년 10월 17일 토요일 낮 12시 · 그랜드 컨벤션 5층 그레이스홀" />
<meta property="og:type" content="website" />
<meta property="og:title" content="민준 ♥ 서연 결혼합니다" />
<meta property="og:description" content="2026년 10월 17일 토요일 낮 12시&#10;그랜드 컨벤션 5층 그레이스홀" />
<meta property="og:image" content="assets/images/cover.svg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<script src="config.js"></script>
</head>
<body>

<div class="stage">
  <div class="paper" id="paper">

    <!-- ══════════════ 표지 ══════════════ -->
    <header class="cover" id="cover">
      <div class="cover__media">
        <img class="cover__img" id="coverImg" src="" alt="" decoding="async" fetchpriority="high" />
        <span class="cover__scrim"></span>
      </div>

      <div class="cover__inner">
        <p class="cover__label" data-cover-anim="1"><span data-bind="cover.label"></span></p>

        <h1 class="cover__names" data-cover-anim="2">
          <span class="cover__name" data-bind="cover.titleLeft"></span>
          <span class="cover__amp">&amp;</span>
          <span class="cover__name" data-bind="cover.titleRight"></span>
        </h1>

        <span class="rule rule--light" data-cover-anim="3"></span>

        <p class="cover__date" data-cover-anim="4" data-bind="wedding.dateTextShort"></p>
        <p class="cover__place" data-cover-anim="5">
          <span data-bind="venue.name"></span> <span data-bind="venue.hall"></span>
        </p>
      </div>

      <div class="cover__scroll" aria-hidden="true"><span></span></div>
    </header>

    <!-- ══════════════ 인사말 ══════════════ -->
    <section class="section section--greeting">
      <p class="eyebrow reveal" data-bind="greeting.label"></p>
      <h2 class="heading reveal" data-delay="1" data-bind="greeting.title"></h2>
      <span class="rule reveal" data-delay="2"></span>

      <p class="poem reveal" data-delay="3" id="greetingPoem"></p>
      <p class="body-text reveal" data-delay="4" id="greetingMessage"></p>

      <div class="family reveal" data-delay="5" id="familyBlock"></div>

      <div class="contact-open reveal" data-delay="6" id="contactOpenWrap" hidden>
        <button type="button" class="btn btn--line" id="contactOpen">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11.4 11.4 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .58 3.6 1 1 0 0 1-.25 1z"/></svg>
          연락하기
        </button>
      </div>
    </section>

    <!-- ══════════════ 갤러리 ══════════════ -->
    <section class="section section--gallery">
      <p class="eyebrow reveal" data-bind="gallery.label"></p>
      <h2 class="heading reveal" data-delay="1" data-bind="gallery.title"></h2>
      <span class="rule reveal" data-delay="2"></span>

      <div class="gallery reveal" data-delay="3">
        <div class="gallery__track" id="galleryTrack"></div>
        <div class="gallery__bar">
          <button type="button" class="gallery__nav" id="galleryPrev" aria-label="이전 사진">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
          </button>
          <p class="gallery__count"><b id="galleryIndex">1</b><i>/</i><span id="galleryTotal">1</span></p>
          <button type="button" class="gallery__nav" id="galleryNext" aria-label="다음 사진">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <div class="thumbs reveal" data-delay="4" id="galleryThumbs"></div>
    </section>

    <!-- ══════════════ 달력 · 디데이 ══════════════ -->
    <section class="section section--date" id="dateSection">
      <p class="eyebrow reveal">THE DAY</p>
      <h2 class="heading reveal" data-delay="1" data-bind="wedding.dateText"></h2>
      <span class="rule reveal" data-delay="2"></span>

      <div class="calendar reveal" data-delay="3" id="calendar" hidden></div>
      <p class="dday reveal" data-delay="4" id="dday" hidden></p>
    </section>

    <!-- ══════════════ 오시는 길 ══════════════ -->
    <section class="section section--location">
      <p class="eyebrow reveal" data-bind="venue.label"></p>
      <h2 class="heading reveal" data-delay="1" data-bind="venue.name"></h2>
      <p class="sub reveal" data-delay="2"><span data-bind="venue.hall"></span></p>
      <span class="rule reveal" data-delay="3"></span>

      <div class="map reveal" data-delay="4">
        <div class="map__canvas" id="mapCanvas"></div>
      </div>

      <div class="addr reveal" data-delay="5">
        <p class="addr__text" data-bind="venue.address"></p>
        <div class="addr__tools">
          <button type="button" class="chip" id="copyAddress">주소 복사</button>
          <a class="chip" id="venueTel" href="#">예식장 전화</a>
        </div>
      </div>

      <div class="mapapps reveal" data-delay="6" id="mapApps"></div>

      <ul class="info reveal" data-delay="7" id="transportList"></ul>
    </section>

    <!-- ══════════════ 마음 전하실 곳 ══════════════ -->
    <section class="section section--account" id="accountSection" hidden>
      <p class="eyebrow reveal" data-bind="accounts.label"></p>
      <h2 class="heading reveal" data-delay="1" data-bind="accounts.title"></h2>
      <span class="rule reveal" data-delay="2"></span>
      <p class="body-text reveal" data-delay="3" id="accountMessage"></p>

      <div class="accordion reveal" data-delay="4" id="accountAccordion"></div>
    </section>

    <!-- ══════════════ 마무리 ══════════════ -->
    <footer class="ending">
      <div class="ending__media reveal">
        <img id="endingImg" src="" alt="" loading="lazy" decoding="async" />
      </div>
      <p class="ending__text reveal" data-delay="1" id="endingMessage"></p>

      <div class="ending__share reveal" data-delay="2">
        <button type="button" class="btn btn--solid" id="shareKakao" hidden>
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 3C6.9 3 2.8 6.3 2.8 10.3c0 2.6 1.7 4.9 4.3 6.2l-1 3.7c-.1.4.3.6.6.4l4.4-2.9c.3 0 .6.1.9.1 5.1 0 9.2-3.3 9.2-7.5S17.1 3 12 3z"/></svg>
          카카오톡으로 공유
        </button>
        <button type="button" class="btn btn--line" id="shareLink">
          <svg viewBox="0 0 24 24" class="ico ico--stroke" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l2.4-2.4a5 5 0 1 0-7.1-7.1L11 4.9"/><path d="M14 11a5 5 0 0 0-7.1 0l-2.4 2.4a5 5 0 1 0 7.1 7.1l1.4-1.4"/></svg>
          링크 복사
        </button>
      </div>

      <p class="ending__sign reveal" data-delay="3">
        <span data-bind="couple.groom.name"></span>
        <i>·</i>
        <span data-bind="couple.bride.name"></span>
      </p>
    </footer>

  </div><!-- /paper -->
</div><!-- /stage -->

<!-- 배경음악 토글 -->
<button type="button" class="bgm" id="bgmToggle" hidden aria-label="배경음악 재생">
  <span class="bgm__bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<!-- 연락처 시트 -->
<div class="sheet" id="contactSheet" hidden>
  <div class="sheet__dim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="연락처">
    <div class="sheet__grip" aria-hidden="true"></div>
    <h3 class="sheet__title">연락하기</h3>
    <div class="sheet__body" id="contactList"></div>
    <button type="button" class="sheet__close" data-close>닫기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/main.js"></script>
</body>
</html>
