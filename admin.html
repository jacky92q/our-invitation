<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#F7F4EF" />
<title>청첩장 관리자</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/admin.css" />
<script src="config.js"></script>
</head>
<body>

<!-- ── 로그인 ── -->
<section class="gate" id="gate">
  <div class="gate__box">
    <p class="gate__eyebrow">WEDDING INVITATION</p>
    <h1 class="gate__title">관리자 로그인</h1>
    <form id="loginForm" autocomplete="on">
      <label class="field">
        <span class="field__label">이메일</span>
        <input type="email" name="email" required autocomplete="username" />
      </label>
      <label class="field">
        <span class="field__label">비밀번호</span>
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn--solid" id="loginSubmit">로그인</button>
    </form>
    <p class="gate__note" id="gateNote"></p>
  </div>
</section>

<!-- ── 편집 화면 ── -->
<div class="admin" id="admin" hidden>
  <header class="topbar">
    <div class="topbar__inner">
      <div>
        <p class="topbar__label">청첩장 관리</p>
        <p class="topbar__user" id="currentUser"></p>
      </div>
      <div class="topbar__acts">
        <a class="btn btn--ghost" href="index.html" target="_blank" rel="noopener">청첩장 보기</a>
        <button type="button" class="btn btn--ghost" id="logout">로그아웃</button>
        <button type="button" class="btn btn--solid" id="save">저장하기</button>
      </div>
    </div>
    <p class="topbar__state" id="saveState"></p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="panels" id="panels"></main>

  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__text">
        저장한 내용은 청첩장 주소에 바로 반영됩니다. (새로고침 필요)
      </p>
      <div class="footer__acts">
        <button type="button" class="btn btn--ghost" id="exportJson">설정 내려받기</button>
        <label class="btn btn--ghost">
          설정 불러오기
          <input type="file" id="importJson" accept="application/json" hidden />
        </label>
        <button type="button" class="btn btn--ghost btn--danger" id="resetAll">기본값으로 되돌리기</button>
      </div>
    </div>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/admin.js"></script>
</body>
</html>
